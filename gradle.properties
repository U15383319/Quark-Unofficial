org.gradle.jvmargs=-Xmx4G -Duser.language=en -Duser.country=US -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Fabric Properties
minecraft_version=1.20.1
loader_version=0.19.2
loom_version=1.16-SNAPSHOT
parchment_version=2023.09.03
fabric_api_version=0.92.9+1.20.1

# Mod Properties
mod_version=4.0-463
maven_group=org.violetmoon.quark
archives_base_name=QuarkWoven-1.20.1

# Zeta Woven: vendored org.violetmoon.zeta:Zeta:1.0-29.135, released as its own mod.
# Version = upstream version + ".woven.N"; bump N for every Zeta Woven release.
zeta_version=1.0-29.135.woven.1
# the Zeta Woven versions Quark Woven accepts (Fabric version predicate)
zeta_version_range=>=1.0-29.135.woven.1 <1.0-29.136

# Dependencies
modmenu_version=7.2.2
reach_entity_attributes_version=2.4.0
# Forge Config API Port: keeps Zeta's ForgeConfigSpec-based TOML configs identical to the Forge version
forge_config_api_port_version=v8.0.3-1.20.1-Fabric
