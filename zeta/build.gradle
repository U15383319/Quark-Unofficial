version = project.zeta_version
base {
	archivesName = 'ZetaWoven-1.20.1'
}

loom {
	accessWidenerPath = file('src/main/resources/zeta.accesswidener')
}

// Zeta is launched as part of Quark (the root project's runs), not on its own
tasks.matching { it.name.startsWith('run') }.configureEach { enabled = false }

processResources {
	def version = project.version
	inputs.property 'version', version

	// plain replace: fabric.mod.json contains '$' (inner class names in injected interfaces)
	filesMatching('fabric.mod.json') {
		filter { line -> line.replace('${version}', version.toString()) }
	}
}

jar {
	from('LICENSE.md') {
		rename { "${it}_zeta" }
	}
}

// Third-party integrations are ported in a later phase (see PORTING.md)
sourceSets.main.java {
	exclude 'org/violetmoon/zeta/integration/**'
}
