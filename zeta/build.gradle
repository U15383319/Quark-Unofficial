version = project.zeta_version
base {
	archivesName = 'Zeta-Fabric-1.20.1'
}

loom {
	accessWidenerPath = file('src/main/resources/zeta.accesswidener')
}

processResources {
	def version = project.version
	inputs.property 'version', version

	filesMatching('fabric.mod.json') {
		expand 'version': version
	}
}

jar {
	from('LICENSE.md') {
		rename { "${it}_zeta" }
	}
}

// Third-party integrations are ported in a later phase (see PORTING.md)
sourceSets.main.java {
	exclude 'org/violetmoon/zeta/integration/**'
}
