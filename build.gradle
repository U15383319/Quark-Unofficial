plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
}

subprojects {
	// zeta shares the root conventions below
}

allprojects {
	apply plugin: 'net.fabricmc.fabric-loom-remap'
	apply plugin: 'maven-publish'

	group = project.maven_group

	repositories {
		maven {
			name = 'ParchmentMC'
			url = 'https://maven.parchmentmc.org'
		}
		maven {
			name = 'Modrinth'
			url = 'https://api.modrinth.com/maven'
			content {
				includeGroup 'maven.modrinth'
			}
		}
	}

	dependencies {
		minecraft "com.mojang:minecraft:${project.minecraft_version}"
		mappings loom.layered() {
			officialMojangMappings()
			parchment("org.parchmentmc.data:parchment-${project.minecraft_version}:${project.parchment_version}@zip")
		}
		modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
		modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

		// Forge Config API Port shades night-config, so it is not declared separately
		modApi "maven.modrinth:forge-config-api-port:${project.forge_config_api_port_version}"
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.release = 17
		it.options.encoding = 'UTF-8'
		it.options.compilerArgs << '-Xmaxerrs' << '100000'
	}

	java {
		withSourcesJar()
		sourceCompatibility = JavaVersion.VERSION_17
		targetCompatibility = JavaVersion.VERSION_17
	}
}

version = project.mod_version
base {
	archivesName = project.archives_base_name
}

// headless smoke tests (gradle runGametest); not part of the mod jar
sourceSets {
	gametest {
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
	}
}

loom {
	accessWidenerPath = file('src/main/resources/quark.accesswidener')
	// Mixin targets are written with Mojang names; the annotation processor writes a refmap so that they resolve
	// against intermediary names in the released jar (check with runProductionClient)
	mixin {
		useLegacyMixinAp = true
		defaultRefmapName = 'quark.refmap.json'
	}
	mods {
		quark {
			sourceSet sourceSets.main
		}
		zeta {
			sourceSet project(':zeta').sourceSets.main
		}
		'quark-gametest' {
			sourceSet sourceSets.gametest
		}
	}

	runs {
		configureEach {
			property 'mixin.debug.export', 'true'
		}
		client {
			runDir 'run'
		}
		server {
			runDir 'runServer'
		}
		// headless check: starts a game test server (loads all data packs, needs no EULA), runs the tests (none yet), exits
		gametest {
			server()
			configName = 'Game Test'
			source sourceSets.gametest
			property 'fabric-api.gametest'
			property 'fabric-api.gametest.report-file', "${project.buildDir}/junit.xml"
			runDir 'build/gametest'
		}
		// applies all mixins at client init, logs every failure, then exits (see ZetaModFabricClient)
		mixinAudit {
			inherit client
			configName = 'Mixin Audit'
			property 'zeta.debug.mixinAudit', 'true'
			property 'mixin.ignoreRequired', 'true'
		}
	}
}

repositories {
	maven {
		name = 'JamiesWhiteShirt'
		url = 'https://maven.jamieswhiteshirt.com/libs-release'
		content {
			includeGroup 'com.jamieswhiteshirt'
		}
	}
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases'
		content {
			includeGroup 'com.terraformersmc'
		}
	}
}

dependencies {
	implementation project(path: ':zeta', configuration: 'namedElements')

	// Forge's BLOCK_REACH / ENTITY_REACH attributes (forgotten hat)
	modImplementation "com.jamieswhiteshirt:reach-entity-attributes:${project.reach_entity_attributes_version}"
	include "com.jamieswhiteshirt:reach-entity-attributes:${project.reach_entity_attributes_version}"

	// optional: config screen button in Mod Menu (Forge's ConfigScreenFactory)
	modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	modLocalRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
}

// Production check: the released jars with intermediary names, like a player's game (dev runs use Mojang names,
// where a wrong mixin target can still match by name). The other mods come unremapped from Maven.
configurations {
	productionRuntimeMods {
		transitive = false
	}
	// the released Fabric API leaves out its gametest module
	productionGametestMods {
		transitive = false
	}
	// popular client mods that touch the same rendering code as Quark (runProductionCompatAudit)
	productionCompatMods {
		transitive = false
	}
}

dependencies {
	productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	productionRuntimeMods "maven.modrinth:forge-config-api-port:${project.forge_config_api_port_version}"
	productionGametestMods "net.fabricmc.fabric-api:fabric-gametest-api-v1:1.2.15+1802ada577"
	productionCompatMods "maven.modrinth:sodium:mc1.20.1-0.5.13-fabric"
	productionCompatMods "maven.modrinth:iris:1.7.6+1.20.1"
}

def productionMods = { task ->
	task.mods.from(tasks.named('remapJar'), project(':zeta').tasks.named('remapJar'), project(':oddities').tasks.named('remapJar'), configurations.productionRuntimeMods)
	task.runDir = file('build/production')
}

tasks.register('runProductionClient', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
	group = 'fabric'
	productionMods(it)
}

// applies every mixin at client init in the production environment, then exits (see ZetaModFabricClient)
tasks.register('runProductionMixinAudit', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
	group = 'fabric'
	productionMods(it)
	jvmArgs.add('-Dzeta.debug.mixinAudit=true')
}

// the mixin audit with Sodium and Iris installed: mixin conflicts with them show up here
tasks.register('runProductionCompatAudit', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
	group = 'fabric'
	productionMods(it)
	mods.from(configurations.productionCompatMods)
	runDir = file('build/production-compat')
	jvmArgs.add('-Dzeta.debug.mixinAudit=true')
	// Loom runs Java 21+ games on LWJGL 3.3.2, which Sodium refuses (players' launchers use 3.3.1); test runs only
	jvmArgs.add('-Dsodium.checks.issue2561=false')
}

// Client smoke run (see QuarkClientSmoke): joins a copy of the production gametest world, runs -PsmokeCommands
// ("|"-separated commands, "wait N" ticks, "shot" for a screenshot) and saves build/production-compat/screenshots.
// With Sodium and Iris unless -PsmokeVanilla is given. Run runProductionGametest once first, for the world.
def smokeWorld = tasks.register('prepareSmokeWorld', Copy) {
	from('build/production-gametest/world')
	into('build/production-compat/saves/smoke')
	exclude('session.lock')
}

tasks.register('runProductionSmoke', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
	group = 'fabric'
	dependsOn(smokeWorld)
	productionMods(it)
	mods.from(remapGametestJar, configurations.productionGametestMods)
	if(!project.hasProperty('smokeVanilla'))
		mods.from(configurations.productionCompatMods)
	runDir = file('build/production-compat')
	programArgs.addAll('--quickPlaySingleplayer', 'smoke')
	jvmArgs.add('-Dquark.smoke=true')
	jvmArgs.add("-Dquark.smoke.commands=${project.findProperty('smokeCommands') ?: ''}")
	jvmArgs.add('-Dsodium.checks.issue2561=false')
}

// Multiplayer smoke run: runProductionServer, then (once it says "Done") runProductionMultiplayer, which joins it
// and runs -PsmokeCommands like runProductionSmoke; QuarkServerSmoke makes the player an operator and stops the
// server when the player leaves. The EULA line below was agreed to by the project owner for these test runs.
tasks.register('runProductionServer', net.fabricmc.loom.task.prod.ServerProductionRunTask) {
	group = 'fabric'
	productionMods(it)
	mods.from(remapGametestJar, configurations.productionGametestMods)
	loaderVersion = project.loader_version
	minecraftVersion = project.minecraft_version
	runDir = file('build/production-server')
	jvmArgs.add('-Dquark.smoke.server=true')
	programArgs.add('nogui')
	def dir = file('build/production-server')
	// written here, not in a separate task: the run directory is this task's output, so Gradle clears it first
	doFirst {
		dir.mkdirs()
		new File(dir, 'eula.txt').text = 'eula=true\n'
		new File(dir, 'server.properties').text = [
			'online-mode=false', 'enforce-secure-profile=false', 'server-port=25570', 'level-type=minecraft\\:flat',
			'spawn-protection=0', 'allow-flight=true', 'spawn-monsters=false', 'motd=Quark Woven test server'
		].join('\n') + '\n'
	}
}

tasks.register('runProductionMultiplayer', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
	group = 'fabric'
	productionMods(it)
	mods.from(remapGametestJar, configurations.productionGametestMods)
	runDir = file('build/production-multiplayer')
	programArgs.addAll('--quickPlayMultiplayer', 'localhost:25570')
	jvmArgs.add('-Dquark.smoke=true')
	jvmArgs.add("-Dquark.smoke.commands=${project.findProperty('smokeCommands') ?: ''}")
}

// the gametests as an intermediary-named mod, to run them against the released jars (runProductionGametest)
def gametestJar = tasks.register('gametestJar', Jar) {
	from sourceSets.gametest.output
	archiveClassifier = 'gametest-dev'
	destinationDirectory = layout.buildDirectory.dir('devlibs')
}

def remapGametestJar = tasks.register('remapGametestJar', net.fabricmc.loom.task.RemapJarTask) {
	inputFile = gametestJar.flatMap { it.archiveFile }
	archiveClassifier = 'gametest'
	destinationDirectory = layout.buildDirectory.dir('devlibs') // not a release artifact
	addNestedDependencies = false
	classpath.from(sourceSets.gametest.compileClasspath)
}

// the gametests on a production server with the released jars; no EULA involved (Fabric's gametest server skips it)
tasks.register('runProductionGametest', net.fabricmc.loom.task.prod.ServerProductionRunTask) {
	group = 'fabric'
	productionMods(it)
	mods.from(remapGametestJar, configurations.productionGametestMods)
	// -PprodLoader=<version> runs them on another Fabric Loader, e.g. the oldest one fabric.mod.json accepts
	loaderVersion = project.findProperty('prodLoader') ?: project.loader_version
	minecraftVersion = project.minecraft_version
	runDir = file('build/production-gametest')
	jvmArgs.add('-Dfabric-api.gametest')
	jvmArgs.add("-Dfabric-api.gametest.report-file=${project.buildDir}/production-junit.xml")
}

processResources {
	def version = project.version
	def zetaRange = project.zeta_version_range
	inputs.property 'version', version
	inputs.property 'zetaRange', zetaRange

	// plain replace: fabric.mod.json contains '$' (inner class names in injected interfaces)
	filesMatching('fabric.mod.json') {
		filter { line -> line.replace('${version}', version.toString()).replace('${zeta_version_range}', zetaRange.toString()) }
	}
}

jar {
	from('LICENSE.md') {
		rename { "${it}_quark" }
	}
	// the bundled Java Universal Tween Engine is Apache 2.0, which asks for its license text with every copy
	from('src/main/java/aurelienribon') {
		include 'LICENSE', 'NOTICE'
		rename { "${it}_tweenengine" }
	}
}

// Third-party integrations are ported in a later phase (see PORTING.md); their interfaces and dummy fallbacks stay
sourceSets.main.java {
	exclude 'org/violetmoon/quark/integration/jei/**'
	exclude 'org/violetmoon/quark/integration/mixin/**'
	exclude 'org/violetmoon/quark/integration/claim/FlanIntegration.java'
	exclude 'org/violetmoon/quark/integration/lootr/Lootr*.java'
	exclude 'org/violetmoon/quark/integration/lootr/client/ClientLootrIntegration.java'
	exclude 'org/violetmoon/quark/integration/lootr/client/LootrVariantChestRenderer.java'
	exclude 'org/violetmoon/quark/integration/terrablender/TerrablenderUndergroundBiomeHandler.java'
	exclude 'org/violetmoon/quark/content/tweaks/compat/**'
}
